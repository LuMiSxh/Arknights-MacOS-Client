name: Feature request
description: Suggest an improvement to the launcher.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change?
      description: Describe the requested behavior or interface change.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
    validations:
      required: true
