name: Bug report
description: Report a reproducible launcher or game compatibility problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Launcher version
      placeholder: 0.2.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Mac and macOS
      description: Include the macOS version, Mac model or chip, and memory.
      placeholder: macOS 26.0; MacBook Air (M2, 2022); 16 GB
    validations:
      required: true

  - type: input
    id: code
    attributes:
      label: Error code
      description: Keep the code shown by the launcher, if one was provided.
      placeholder: PEBBLE

  - type: input
    id: operation
    attributes:
      label: Failed operation
      description: The launcher fills this when the report starts from a recovery action.

  - type: input
    id: region
    attributes:
      label: Selected region
      description: Global, Japan, or Korea when the failure belongs to a regional operation.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the launcher
        2. Select Play
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag launcher.log and wine.log here if available. Review them first because local paths may contain your macOS account name.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that an existing issue does not already describe this problem.
          required: true
