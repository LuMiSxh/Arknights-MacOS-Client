name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      dry_run:
        description: Build, sign, and verify everything, but publish nothing (no draft, no Pages deploy, no attestation)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Keep this independent from packaging: a Pages failure must fail the run,
  # but must not prevent the package job from creating its draft release.
  pages:
    name: Publish website
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  package:
    name: Build and draft release
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the Swift toolchain version
        id: swift
        run: |
          set -euo pipefail
          version="$(xcrun swift --version | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p' | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the SwiftPM build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.swift.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Restore the SwiftPM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-cache-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-cache-${{ steps.swift.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Set up OpenSSL 3 for Sparkle Ed25519 verification
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix openssl@3)/bin/openssl" version

      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be triggered from main after the release branch is merged." >&2
            exit 1
          fi
          uv run --locked --no-dev scripts/release.py validate "$RELEASE_VERSION"
          release_tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null; then
            echo "Tag $release_tag already exists." >&2
            exit 1
          else
            tag_status=$?
            if [[ "$tag_status" -ne 2 ]]; then
              echo "Unable to check whether tag $release_tag exists." >&2
              exit "$tag_status"
            fi
          fi
          if release_output="$(gh release view "$release_tag" 2>&1)"; then
            echo "Release $release_tag already exists." >&2
            exit 1
          elif [[ "$release_output" != *"release not found"* ]]; then
            echo "Unable to check release $release_tag: $release_output" >&2
            exit 1
          fi

      - name: Resolve project names
        run: uv run --locked --no-dev scripts/project_config.py github-env >> "$GITHUB_ENV"

      - name: Test source
        run: just ci

      - name: Prepare release notes
        run: uv run --locked --no-dev scripts/release.py notes "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Set release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Sparkle orders updates by CFBundleVersion, so it must never fall below the
          # newest published build. Only a repository without any published release falls
          # back to the run number.
          previous_appcast="$RUNNER_TEMP/previous-appcast.xml"
          appcast_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
          appcast_args=()
          rm -f "$previous_appcast"
          status="$(curl --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$previous_appcast" --write-out '%{http_code}' "$appcast_url")" || {
            echo "Unable to fetch the previous Sparkle appcast from $appcast_url." >&2
            exit 1
          }
          case "$status" in
            200)
              appcast_args=(--previous-appcast "$previous_appcast")
              ;;
            404)
              rm -f "$previous_appcast"
              # A 404 on the appcast also occurs when the latest release lacks the asset.
              # Reusing the run number then could lower CFBundleVersion, so check for a release.
              release_error="$RUNNER_TEMP/latest-release.err"
              if latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$release_error")"; then
                echo "::error::Latest release $latest_tag has no appcast.xml asset; cannot derive CFBundleVersion." >&2
                exit 1
              fi
              if ! grep -q 'HTTP 404' "$release_error"; then
                cat "$release_error" >&2
                echo "::error::Unable to query the latest release of $GITHUB_REPOSITORY." >&2
                exit 1
              fi
              echo "::warning::No published release; CFBundleVersion uses the run number."
              ;;
            *)
              echo "Unexpected HTTP $status fetching the previous Sparkle appcast." >&2
              exit 1
              ;;
          esac
          bundle_version="$(uv run --locked --no-dev scripts/release.py bundle-version \
            "$GITHUB_RUN_NUMBER" ${appcast_args[@]+"${appcast_args[@]}"})"
          echo "CFBundleVersion: $bundle_version"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $bundle_version" Resources/Info.plist

      - name: Build DMG
        run: just dmg --strict-licenses

      - name: Create and sign Sparkle update
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          update_directory="$RUNNER_TEMP/sparkle-updates"
          mkdir -p "$update_directory"
          # Sparkle extracts .tar.xz with /usr/bin/tar, which preserves symlinks, modes, and signatures.
          tar -C dist -cJf "$update_directory/$UPDATE_NAME" "$APP_NAME"
          cp "$RUNNER_TEMP/release-notes.md" \
            "$update_directory/${UPDATE_NAME%.tar.xz}.md"
          # Deltas are an optimization: a failure here only logs a warning and ships the full archive.
          uv run --locked --no-dev scripts/sparkle_deltas.py fetch \
            --repository "$GITHUB_REPOSITORY" \
            --current-version "$RELEASE_VERSION" \
            --update-name "$UPDATE_NAME" \
            --destination "$update_directory" \
            --count "$DELTA_SOURCES"
          generate_appcast="$(find "$GITHUB_WORKSPACE/.build/artifacts/sparkle" \
            -type f -path '*/Sparkle/bin/generate_appcast' -perm -111 -print -quit)"
          sign_update="$(find "$GITHUB_WORKSPACE/.build/artifacts/sparkle" \
            -type f -path '*/Sparkle/bin/sign_update' -perm -111 -print -quit)"
          if [[ -z "$generate_appcast" || -z "$sign_update" ]]; then
            echo "Sparkle generate_appcast or sign_update tool not found." >&2
            exit 1
          fi
          release_prefix="https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION/"
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$release_prefix" \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas "$DELTA_SOURCES" \
            "$update_directory"
          uv run --locked --no-dev scripts/sparkle_deltas.py finalize \
            --directory "$update_directory" \
            --appcast "$update_directory/appcast.xml" \
            --output dist \
            --sign-update "$sign_update"
          uv run --locked --no-dev scripts/validate_sparkle_keys.py \
            --plist "dist/$APP_NAME/Contents/Info.plist" \
            --sign-update "$sign_update" \
            --appcast "$update_directory/appcast.xml" \
            --update-file "$update_directory/$UPDATE_NAME" \
            --delta-directory dist
          cp "$update_directory/$UPDATE_NAME" "dist/$UPDATE_NAME"
          cp "$update_directory/appcast.xml" dist/appcast.xml
          deltas=(dist/*.delta)
          shasum -a 256 "dist/$DMG_NAME" \
            "dist/$UPDATE_NAME" "${deltas[@]}" \
            dist/appcast.xml > dist/SHA256SUMS

      - name: Attest release provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          subject-path: |
            dist/*.dmg
            dist/*.tar.xz
            dist/*.delta
            dist/appcast.xml
            dist/SHA256SUMS

      - name: Upload dry-run files for inspection
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-v${{ inputs.version }}
          path: |
            dist/*.dmg
            dist/*.tar.xz
            dist/*.delta
            dist/appcast.xml
            dist/SHA256SUMS
          retention-days: 3

      - name: Create draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          release_tag="v$RELEASE_VERSION"
          deltas=(dist/*.delta)
          gh release create "$release_tag" \
            "dist/$DMG_NAME" \
            "dist/$UPDATE_NAME" \
            "${deltas[@]}" \
            dist/appcast.xml \
            dist/SHA256SUMS \
            --draft \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --title "$DISPLAY_NAME $release_tag"
