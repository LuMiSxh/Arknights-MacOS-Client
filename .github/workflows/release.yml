name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate runtime configuration
        run: uv run scripts/runtime_config.py --validate runtime.json

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Validate release inputs
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Releases must be triggered from main after the release branch is merged." >&2
            exit 1
          fi
          uv run scripts/release_validation.py "$RELEASE_VERSION"
          release_tag="v$RELEASE_VERSION"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "Tag $release_tag already exists." >&2
            exit 1
          fi
          if [[ "$tag_status" -ne 2 ]]; then
            echo "Unable to check whether tag $release_tag exists." >&2
            exit "$tag_status"
          fi
          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          if [[ "$release_status" == "200" ]]; then
            echo "Release $release_tag already exists." >&2
            exit 1
          fi
          if [[ "$release_status" != "404" ]]; then
            echo "Unable to check release $release_tag (HTTP $release_status)." >&2
            exit 1
          fi

      - name: Test source
        run: just ci

      - name: Prepare release notes
        run: uv run scripts/extract_changelog.py "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Download runtime and build recipe
        run: |
          mkdir -p dist
          build_recipe="$RUNNER_TEMP/Runtime-Build-Recipe.tar.gz"
          build_recipe_url="$(uv run scripts/runtime_config.py runtime.json buildRecipe.url)"
          build_recipe_sha256="$(uv run scripts/runtime_config.py runtime.json buildRecipe.sha256)"
          uv run scripts/download_runtime.py
          curl --fail --location --proto '=https' --tlsv1.2 "$build_recipe_url" --output "$build_recipe"
          echo "$build_recipe_sha256  $build_recipe" | shasum -a 256 --check
          mv "$build_recipe" "dist/Runtime-Build-Recipe.tar.gz"

      - name: Set release version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build DMG
        run: |
          just dmg "$GITHUB_WORKSPACE/.build/runtime"
          dmg_name="$(uv run scripts/project_config.py dmg-name)"
          shasum -a 256 "dist/$dmg_name" dist/Runtime-Build-Recipe.tar.gz > dist/SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/Runtime-Build-Recipe.tar.gz
            dist/SHA256SUMS

      - name: Create draft release
        run: |
          release_tag="v$RELEASE_VERSION"
          display_name="$(uv run scripts/project_config.py display-name)"
          dmg_name="$(uv run scripts/project_config.py dmg-name)"
          gh release create "$release_tag" \
            "dist/$dmg_name" \
            dist/Runtime-Build-Recipe.tar.gz \
            dist/SHA256SUMS \
            --draft \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --title "$display_name $release_tag"
