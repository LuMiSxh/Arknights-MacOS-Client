name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Keep this independent from packaging: a Pages failure must fail the run,
  # but must not prevent the package job from creating its draft release.
  pages:
    name: Publish website
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  package:
    name: Build and draft release
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Set up OpenSSL 3 for Sparkle Ed25519 verification
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix openssl@3)/bin/openssl" version

      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be triggered from main after the release branch is merged." >&2
            exit 1
          fi
          uv run --locked --no-dev scripts/release.py validate "$RELEASE_VERSION"
          release_tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null; then
            echo "Tag $release_tag already exists." >&2
            exit 1
          else
            tag_status=$?
            if [[ "$tag_status" -ne 2 ]]; then
              echo "Unable to check whether tag $release_tag exists." >&2
              exit "$tag_status"
            fi
          fi
          if release_output="$(gh release view "$release_tag" 2>&1)"; then
            echo "Release $release_tag already exists." >&2
            exit 1
          elif [[ "$release_output" != *"release not found"* ]]; then
            echo "Unable to check release $release_tag: $release_output" >&2
            exit 1
          fi

      - name: Resolve project names
        run: |
          {
            echo "APP_NAME=$(uv run --locked --no-dev scripts/project_config.py app-bundle-name)"
            echo "DISPLAY_NAME=$(uv run --locked --no-dev scripts/project_config.py display-name)"
            echo "DMG_NAME=$(uv run --locked --no-dev scripts/project_config.py dmg-name)"
            echo "UPDATE_NAME=$(uv run --locked --no-dev scripts/project_config.py sparkle-update-name)"
            echo "DELTA_SOURCES=$(uv run --locked --no-dev scripts/project_config.py sparkle-delta-sources)"
          } >> "$GITHUB_ENV"

      - name: Test source
        run: just ci

      - name: Prepare release notes
        run: uv run --locked --no-dev scripts/release.py notes "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Download runtime and build recipe
        run: |
          mkdir -p dist
          build_recipe="$RUNNER_TEMP/Runtime-Build-Recipe.tar.gz"
          build_recipe_url="$(plutil -extract buildRecipe.url raw runtime.json)"
          build_recipe_sha256="$(plutil -extract buildRecipe.sha256 raw runtime.json)"
          uv run --locked --no-dev scripts/download_runtime.py
          curl --fail --location --proto '=https' --tlsv1.2 "$build_recipe_url" --output "$build_recipe"
          echo "$build_recipe_sha256  $build_recipe" | shasum -a 256 --check
          mv "$build_recipe" "dist/Runtime-Build-Recipe.tar.gz"

      - name: Set release version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build DMG
        run: |
          just dmg "$GITHUB_WORKSPACE/.build/runtime"

      - name: Create and sign Sparkle update
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          update_directory="$RUNNER_TEMP/sparkle-updates"
          mkdir -p "$update_directory"
          # Sparkle extracts .tar.xz with /usr/bin/tar, which preserves symlinks, modes, and signatures.
          tar -C dist -cJf "$update_directory/$UPDATE_NAME" "$APP_NAME"
          cp "$RUNNER_TEMP/release-notes.md" \
            "$update_directory/${UPDATE_NAME%.tar.xz}.md"
          # Deltas are an optimization: a failure here only logs a warning and ships the full archive.
          uv run --locked --no-dev scripts/sparkle_deltas.py fetch \
            --repository "$GITHUB_REPOSITORY" \
            --current-version "$RELEASE_VERSION" \
            --update-name "$UPDATE_NAME" \
            --destination "$update_directory" \
            --count "$DELTA_SOURCES"
          generate_appcast="$(find "$GITHUB_WORKSPACE/.build/artifacts/sparkle" \
            -type f -path '*/Sparkle/bin/generate_appcast' -perm -111 -print -quit)"
          if [[ -z "$generate_appcast" ]]; then
            echo "Sparkle generate_appcast tool not found." >&2
            exit 1
          fi
          release_prefix="https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION/"
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$release_prefix" \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas "$DELTA_SOURCES" \
            "$update_directory"
          uv run --locked --no-dev scripts/sparkle_deltas.py finalize \
            --directory "$update_directory" \
            --appcast "$update_directory/appcast.xml" \
            --output dist
          uv run --locked --no-dev scripts/validate_sparkle_keys.py \
            --plist "dist/$APP_NAME/Contents/Info.plist" \
            --appcast "$update_directory/appcast.xml" \
            --update-name "$UPDATE_NAME" \
            --update-file "$update_directory/$UPDATE_NAME" \
            --delta-directory dist
          cp "$update_directory/$UPDATE_NAME" "dist/$UPDATE_NAME"
          cp "$update_directory/appcast.xml" dist/appcast.xml
          deltas=(dist/*.delta)
          shasum -a 256 "dist/$DMG_NAME" \
            "dist/$UPDATE_NAME" "${deltas[@]}" \
            dist/appcast.xml dist/Runtime-Build-Recipe.tar.gz > dist/SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          subject-path: |
            dist/*.dmg
            dist/*.tar.xz
            dist/*.delta
            dist/appcast.xml
            dist/Runtime-Build-Recipe.tar.gz
            dist/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          release_tag="v$RELEASE_VERSION"
          deltas=(dist/*.delta)
          gh release create "$release_tag" \
            "dist/$DMG_NAME" \
            "dist/$UPDATE_NAME" \
            "${deltas[@]}" \
            dist/appcast.xml \
            dist/Runtime-Build-Recipe.tar.gz \
            dist/SHA256SUMS \
            --draft \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --title "$DISPLAY_NAME $release_tag"
