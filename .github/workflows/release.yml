name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Validate runtime configuration
        run: uv run --no-project --python 3.13 scripts/python/runtime-config.py --validate runtime.json

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Validate release inputs
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z with numeric components." >&2
            exit 1
          fi
          if ! grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a section for $RELEASE_VERSION." >&2
            exit 1
          fi
          release_tag="v$RELEASE_VERSION"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "Tag $release_tag already exists." >&2
            exit 1
          fi
          if [[ "$tag_status" -ne 2 ]]; then
            echo "Unable to check whether tag $release_tag exists." >&2
            exit "$tag_status"
          fi
          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          if [[ "$release_status" == "200" ]]; then
            echo "Release $release_tag already exists." >&2
            exit 1
          fi
          if [[ "$release_status" != "404" ]]; then
            echo "Unable to check release $release_tag (HTTP $release_status)." >&2
            exit 1
          fi

      - name: Test source
        run: just check

      - name: Download runtime and build recipe
        run: |
          mkdir -p dist
          build_recipe="$RUNNER_TEMP/Runtime-Build-Recipe.tar.gz"
          build_recipe_url="$(uv run --no-project --python 3.13 scripts/python/runtime-config.py runtime.json buildRecipe.url)"
          build_recipe_sha256="$(uv run --no-project --python 3.13 scripts/python/runtime-config.py runtime.json buildRecipe.sha256)"
          ./scripts/sh/download-runtime.sh
          curl --fail --location --proto '=https' --tlsv1.2 "$build_recipe_url" --output "$build_recipe"
          echo "$build_recipe_sha256  $build_recipe" | shasum -a 256 --check
          mv "$build_recipe" "dist/Runtime-Build-Recipe.tar.gz"

      - name: Set release version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build DMG
        run: |
          just dmg "$GITHUB_WORKSPACE/.build/runtime"
          shasum -a 256 "dist/Arknights Client.dmg" dist/Runtime-Build-Recipe.tar.gz > dist/SHA256SUMS

      - name: Create draft release
        run: |
          release_tag="v$RELEASE_VERSION"
          gh release create "$release_tag" \
            "dist/Arknights Client.dmg" \
            dist/Runtime-Build-Recipe.tar.gz \
            dist/SHA256SUMS \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "Arknights Client $release_tag"
