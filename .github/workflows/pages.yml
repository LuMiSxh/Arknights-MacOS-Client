name: Publish website

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require main for Pages deployments
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Website deployments must be triggered from main." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          package_json_file: web/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Validate website
        working-directory: web
        run: pnpm run check

      - name: Build website
        working-directory: web
        env:
          BASE_PATH: /Arknights-MacOS-Client
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/build

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
