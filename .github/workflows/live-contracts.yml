name: Live contracts

on:
  schedule:
    - cron: '23 4 * * 1'
      timezone: Etc/UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-contracts
  cancel-in-progress: false

jobs:
  probe:
    name: Yostar launcher API
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check live contracts
        id: contracts
        continue-on-error: true
        env:
          ARKNIGHTS_CLIENT_CONTRACT_REPORT: ${{ runner.temp }}/contract-report.json
        run: |
          set +e
          just live-contracts
          status=$?
          set -e
          if [[ -f "$ARKNIGHTS_CLIENT_CONTRACT_REPORT" ]]; then
            echo "has-report=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Add contract summary
        if: always() && steps.contracts.outputs.has-report == 'true'
        run: |
          jq -r '"## Yostar launcher API\n\n| Region | Contract | Status | Summary |\n| --- | --- | --- | --- |",
            (.checks[] | "| \(.region) | \(.contract) | \(.status) | \(.summary) |")' \
            "${{ runner.temp }}/contract-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized contract report
        id: upload-report
        if: always() && steps.contracts.outputs.has-report == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yostar-contract-report
          path: ${{ runner.temp }}/contract-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Open an issue for new breakage
        if: steps.contracts.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Live contract failure"
          if [[ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]]; then
            gh issue create --title "$title" --body "See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

      - name: Fail for broken contracts
        if: steps.contracts.outcome == 'failure'
        run: exit 1
