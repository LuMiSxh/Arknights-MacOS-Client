name: Live contracts

on:
  schedule:
    - cron: '23 4 * * 1'
      timezone: Etc/UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-contracts
  cancel-in-progress: false

jobs:
  probe:
    name: Yostar launcher API
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Check live contracts
        id: contracts
        continue-on-error: true
        env:
          ARKNIGHTS_CLIENT_CONTRACT_REPORT: ${{ runner.temp }}/contract-report.json
        run: |
          set +e
          just live-contracts
          status=$?
          set -e
          if [[ -f "$ARKNIGHTS_CLIENT_CONTRACT_REPORT" ]]; then
            echo "has-report=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Add contract summary
        if: always() && steps.contracts.outputs.has-report == 'true'
        run: >-
          uv run scripts/contract_monitor.py summarize
          "${{ runner.temp }}/contract-report.json"
          --output "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized contract report
        id: upload-report
        if: always() && steps.contracts.outputs.has-report == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: yostar-contract-report
          path: ${{ runner.temp }}/contract-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail for broken contracts
        if: steps.contracts.outcome == 'failure'
        run: exit 1

  alert:
    name: Reconcile monitor issues
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      needs.probe.outputs.report-artifact-id != ''
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Download current contract report
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.probe.outputs.report-artifact-id }}
          path: ${{ runner.temp }}/contract-report

      - name: Reconcile deduplicated alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run scripts/contract_monitor.py reconcile
          "${{ runner.temp }}/contract-report/contract-report.json"
