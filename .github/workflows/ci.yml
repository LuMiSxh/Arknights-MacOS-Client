name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Check source
        run: just ci

  package:
    name: App packaging smoke
    if: github.event_name == 'push'
    needs: test
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Build app bundle without runtime
        run: just app
