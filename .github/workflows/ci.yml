name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check formatting
        run: swift format lint --configuration .swift-format --recursive --strict Sources Tests

      - name: Run tests
        run: swift test --arch arm64

      - name: Build release executable
        run: swift build --configuration release --arch arm64
