name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The wallpaper tag scan dispatches CI for its pull requests, which GITHUB_TOKEN cannot trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source and integration tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the Swift toolchain version
        id: swift
        run: |
          set -euo pipefail
          version="$(xcrun swift --version | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p' | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the SwiftPM build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.swift.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Restore the SwiftPM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-cache-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-cache-${{ steps.swift.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check source
        run: just ci
