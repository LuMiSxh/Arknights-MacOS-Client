name: Runtime monitor

on:
  schedule:
    - cron: '37 5 * * 3'
      timezone: Etc/UTC
    - cron: '11 6 1 * *'
      timezone: Etc/UTC
  workflow_dispatch:
    inputs:
      verify_archive:
        description: Download and independently hash the pinned runtime archive
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: runtime-monitor
  cancel-in-progress: false

jobs:
  probe:
    name: Runtime metadata and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Inspect runtime sources
        id: monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/runtime-monitor-report.json
          VERIFY_ARCHIVE: ${{ github.event.schedule == '11 6 1 * *' || inputs.verify_archive }}
        run: |
          arguments=()
          if [[ "$VERIFY_ARCHIVE" == "true" ]]; then
            arguments+=(--verify-archive)
          fi
          set +e
          uv run scripts/runtime_monitor.py probe runtime.json \
            --output "$REPORT_PATH" "${arguments[@]}"
          monitor_status=$?
          set -e
          if [[ -f "$REPORT_PATH" ]]; then
            echo "has-report=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$monitor_status"

      - name: Add runtime summary
        if: always() && steps.monitor.outputs.has-report == 'true'
        run: >-
          uv run scripts/runtime_monitor.py summarize
          "${{ runner.temp }}/runtime-monitor-report.json"
          --output "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized runtime report
        id: upload-report
        if: always() && steps.monitor.outputs.has-report == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-monitor-report
          path: ${{ runner.temp }}/runtime-monitor-report.json
          if-no-files-found: error
          retention-days: 60

      - name: Fail for runtime availability incidents
        if: steps.monitor.outcome == 'failure'
        run: exit 1

  alert:
    name: Reconcile runtime issues
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      needs.probe.outputs.report-artifact-id != ''
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Download current runtime report
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.probe.outputs.report-artifact-id }}
          path: ${{ runner.temp }}/runtime-monitor

      - name: Reconcile deduplicated runtime issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run scripts/runtime_monitor.py reconcile
          "${{ runner.temp }}/runtime-monitor/runtime-monitor-report.json"
