[project]
name = "arknights-macos-client-scripts"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-socket==0.7.0"]

[tool.pytest.ini_options]
addopts = ["--disable-socket", "--strict-config", "--strict-markers"]
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]

[tool.uv]
package = false
